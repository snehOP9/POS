name: Production health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    name: Check public restaurant and API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check public restaurant
        run: |
          curl --fail --show-error --silent --location --retry 2 --retry-all-errors --max-time 20 https://emberserve-pos.vercel.app/ > response.html
          grep -F "Ember &amp; Grain" response.html

      - name: Check API readiness
        run: curl --fail --show-error --silent --location --retry 2 --retry-all-errors --max-time 20 https://emberserve-api-staging.onrender.com/ready

      - name: Check live menu endpoint
        run: |
          curl --fail --show-error --silent --location --retry 2 --retry-all-errors --max-time 20 https://emberserve-api-staging.onrender.com/api/v1/menu > menu.json
          grep -F '"success":true' menu.json
