name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Restore Rollup Linux native dependency
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --ignore-scripts "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build shared package
        run: npm run build --workspace=@emberserve/shared

      - name: Build API
        run: npm run build --workspace=@emberserve/api

      - name: Build web app
        run: npm run build --workspace=@emberserve/web

  compose-config:
    name: Validate container release configuration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare safe Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet
