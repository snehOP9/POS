services:
  - type: web
    name: emberserve-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace=@emberserve/api
    startCommand: npm run start --workspace=@emberserve/api
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://emberserve-pos.vercel.app
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: restpos-f145a
